name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          VERSION="${TAG#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/sshm-windows-amd64.exe ./cmd/sshm
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/sshm-linux-amd64     ./cmd/sshm

          (cd dist && sha256sum * > checksums.txt)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
